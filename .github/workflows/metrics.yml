name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # Run every day at midnight UTC
  workflow_dispatch:       # Allow manual trigger from GitHub Actions tab
  push:
    branches: [master]

jobs:
  # ─────────────────────────────────────────────
  # 1. Languages Used
  # ─────────────────────────────────────────────
  metrics-languages:
    name: Languages
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

  # ─────────────────────────────────────────────
  # 2. Isometric Commit Calendar
  # ─────────────────────────────────────────────
  metrics-isocalendar:
    name: Isometric Calendar
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

  # ─────────────────────────────────────────────
  # 3. Coding Habits (time of day, editors, etc.)
  # ─────────────────────────────────────────────
  metrics-habits:
    name: Habits
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

  # ─────────────────────────────────────────────
  # 4. Achievements / Highlights
  # ─────────────────────────────────────────────
  metrics-achievements:
    name: Achievements
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes

  # ─────────────────────────────────────────────
  # 5. GitHub Activity (base header + activity)
  # ─────────────────────────────────────────────
  metrics-activity:
    name: Activity
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity
          plugin_lines: yes
